<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timeline Vault</title>
    <!-- FileSaver for downloading the ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --primary: #007bff;
            --danger: #dc3545;
            --bg: #f4f6f8;
            --text: #212529;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0 0 10px 0; font-size: 1.5rem; }
        .header-actions { display: flex; gap: 10px; justify-content: center; }
        .header-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            padding: 15px;
            background: var(--card-bg);
            border-bottom: 1px solid #ddd;
        }
        .controls button {
            padding: 12px 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .controls button:active { transform: scale(0.98); background: #eee; }
        .controls button.primary { background: var(--primary); color: white; border-color: var(--primary); }
        .controls button.danger { background: var(--danger); color: white; border-color: var(--danger); }
        
        #timelines-container { padding: 15px; }
        .timeline-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .timeline-card h3 { margin-top: 0; color: var(--primary); }
        
        /* Processing Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal.hidden { display: none; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h2 { margin-top: 0; color: var(--primary); }
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #0056b3);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <header>
        <h1>Timeline Vault</h1>
        <div class="header-actions">
            <button type="button" id="btn-backup-all">Backup All (ZIP)</button>
            <button type="button" id="btn-restore-all">Restore All</button>
        </div>
    </header>

    <div class="controls">
        <button type="button" class="primary">+ Create New Timeline</button>
        <button type="button">← Back</button>
        <button type="button">Show Options</button>
        <button type="button">Wrap Content</button>
        <button type="button" class="danger">Delete</button>
        <button type="button" id="btn-backup-timeline" class="primary">Backup This Timeline (ZIP)</button>
        <button type="button">Copy All Timeline Text</button>
    </div>

    <div id="timelines-container">
        <!-- Demo Timeline Card -->
        <div class="timeline-card" data-id="tl-1">
            <h3>Timeline 1</h3>
            <p>Add files below to test the crash-proof backup system.</p>
            <input type="file" class="timeline-file-input" multiple accept="image/*,.gif,.txt,.mp4" style="margin-top:10px; display:block;">
        </div>
    </div>

    <!-- Processing Modal -->
    <div id="processing-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Processing...</h2>
            <p id="processing-status">Initializing...</p>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>
            <p id="progress-text">0%</p>
        </div>
    </div>

    <input type="file" id="restore-input" accept=".zip" style="display: none;">

    <script>
        // --- MOCK DATA STORE ---
        const vaultData = {
            'tl-1': { name: 'Timeline 1', files: [] }
        };

        // --- UI HELPERS ---
        const modal = document.getElementById('processing-modal');
        const statusText = document.getElementById('processing-status');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        let isProcessing = false;

        function showProcessing() { modal.classList.remove('hidden'); updateStatus('Initializing...'); updateProgress(0); }
        function hideProcessing() { modal.classList.add('hidden'); }
        function updateStatus(text) { statusText.textContent = text; }
        function updateProgress(percent) {
            const p = Math.round(percent);
            progressFill.style.width = p + '%';
            progressText.textContent = p + '%';
        }

        // --- PREVENT DOUBLE CLICKS & ACCIDENTAL REFRESHES ---
        function preventProcessing(func) {
            return function(e) {
                if (e) e.preventDefault();
                if (isProcessing) {
                    alert('Please wait for the current process to finish.');
                    return;
                }
                func(e);
            }
        }

        // Warn user if they try to refresh/close tab during backup
        window.addEventListener('beforeunload', (e) => {
            if (isProcessing) {
                e.preventDefault();
                e.returnValue = ''; // Triggers browser's native "Are you sure you want to leave?" dialog
            }
        });

        // --- CORE ANTI-CRASH BACKUP ENGINE ---
        async function performBackup(timelineId) {
            isProcessing = true;
            showProcessing();
            
            const timeline = vaultData[timelineId];
            if (!timeline || timeline.files.length === 0) {
                alert('No files to backup in this timeline.');
                isProcessing = false;
                hideProcessing();
                return;
            }

            const files = timeline.files;
            const totalFiles = files.length;

            // 1. CREATE INLINE WEB WORKER
            // This moves the heavy ZIP compression off the main thread, preventing UI freezes and "Unresponsive Page" crashes.
            const workerCode = `
                importScripts('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
                let zip = new JSZip();
                
                self.onmessage = async function(e) {
                    if (e.data.type === 'add') {
                        zip.file(e.data.name, e.data.data);
                        self.postMessage({ type: 'added' });
                    } else if (e.data.type === 'generate') {
                        self.postMessage({ type: 'status', status: 'Compressing...' });
                        const content = await zip.generateAsync(
                            { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } }, 
                            (metadata) => {
                                self.postMessage({ type: 'progress', percent: metadata.percent });
                            }
                        );
                        self.postMessage({ type: 'done', blob: content }, [content]);
                    }
                };
            `;
            
            const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(workerBlob));

            try {
                // 2. SEQUENTIAL PROCESSING WITH TRANSFERABLE OBJECTS
                // This prevents phone hangs by keeping memory usage flat. We process one file at a time 
                // and transfer memory ownership to the worker so the main thread doesn't hoard RAM.
                for (let i = 0; i < totalFiles; i++) {
                    const file = files[i];
                    updateStatus(`Reading ${i + 1}/${totalFiles}: ${file.name}`);
                    updateProgress((i / totalFiles) * 50); // 0-50% for reading phase

                    // Read as ArrayBuffer (33% more memory efficient than Base64 DataURL)
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // Send to worker and wait for confirmation
                    await new Promise((resolve) => {
                        worker.onmessage = (e) => {
                            if (e.data.type === 'added') resolve();
                        };
                        // The [arrayBuffer] at the end transfers memory ownership, freeing main thread RAM instantly
                        worker.postMessage({ type: 'add', name: file.name, data: arrayBuffer }, [arrayBuffer]);
                    });
                    
                    updateProgress(((i + 1) / totalFiles) * 50);
                }

                // 3. GENERATE ZIP IN WORKER
                updateStatus('Finalizing ZIP...');
                worker.onmessage = (e) => {
                    if (e.data.type === 'status') updateStatus(e.data.status);
                    if (e.data.type === 'progress') updateProgress(50 + (e.data.percent / 2)); // 50-100%
                    if (e.data.type === 'done') {
                        saveAs(e.data.blob, `${timeline.name}_backup.zip`);
                        updateStatus('Complete!');
                        updateProgress(100);
                        
                        setTimeout(() => {
                            hideProcessing();
                            isProcessing = false;
                        }, 1000);
                        
                        worker.terminate();
                    }
                };
                
                worker.postMessage({ type: 'generate' });

            } catch (error) {
                console.error('Backup failed:', error);
                alert('Backup failed: ' + error.message);
                hideProcessing();
                isProcessing = false;
                worker.terminate();
            }
        }

        // --- EVENT LISTENERS ---
        document.getElementById('btn-backup-timeline').addEventListener('click', preventProcessing(() => {
            performBackup('tl-1');
        }));

        document.getElementById('btn-backup-all').addEventListener('click', preventProcessing(() => {
            performBackup('tl-1'); // In a full app, iterate through all timelines
        }));

        // Handle file inputs for demo purposes
        document.querySelectorAll('.timeline-file-input').forEach(input => {
            input.addEventListener('change', (e) => {
                const timelineId = e.target.closest('.timeline-card').dataset.id;
                if (vaultData[timelineId]) {
                    vaultData[timelineId].files = Array.from(e.target.files);
                    alert(`Added ${e.target.files.length} files. Click "Backup This Timeline" to test.`);
                }
            });
        });
    </script>
</body>
</html>
